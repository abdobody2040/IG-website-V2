name = "instantgrow-stripe-webhook"
main = "index.ts"
compatibility_date = "2024-03-01"

[vars]
API_URL = "https://instantgrow.net/api"

# Secret variables — set via Wrangler CLI (never commit secrets):
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
# wrangler secret put ADMIN_SECRET        ← must match api/config.php ADMIN_SECRET
# wrangler secret put RESEND_API_KEY
